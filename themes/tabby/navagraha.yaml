# Graha – Tabby-Farbschemata (vier Varianten)
# Abgeleitet aus dem siderischen Geburtshoroskop (Lahiri): 23.05.1982, 19:47 MESZ, Wedel.
#
# Farbton der Akzente = klassische Graha-Farbe (BPHS)
# Saettigung          = Staerke des Grahas im Chart
# Vordergrund         = Chandra, exaltiert in Rohini
#
# Zwei Herleitungen fuer den Grundton, je hell und dunkel:
#   Pratipada / Ushas – Prithvi, aus der Erd-Gruppe im 8. und 12. Haus
#   Swati / Tula      – Vayu, aus dem Lagna (Tula) und Guru in Swati
#
# Einbau: Settings → Config file → Block terminal: / customColorSchemes:
#         Danach Settings → Color Scheme, und Appearance → Terminal background:
#         From color scheme.
#
# Alle Farben 1–15 liegen bei >= 4.5:1 gegen background, surface und overlay.
# Die ANSI-Plaetze tragen nur einen Farbton, keine Rolle – die Zuordnung zu
# Syntaxelementen steht in graha.vim bzw. im VS-Code-Theme.
# Platz 9 ist Surya (Kupfer), nicht ein helleres Mangala.

terminal:
  customColorSchemes:
    # Erde  · dunkel · Grundton 76°  – Prithvi-Dominanz, 5 Grahas in Vrishabha und Kanya
    - name: "Graha Pratipada"
      foreground: "#dcd7c8"
      background: "#16120d"
      selection: "#3c362d"
      cursor: "#00a2a3"
      cursorAccent: "#16120d"
      colors:
        - "#2c2924"  #  0 schwarz     – Grundton
        - "#e46d64"  #  1 rot         – Mangala – 4.6:1
        - "#58a164"  #  2 gruen       – Budha – 4.6:1
        - "#b68a00"  #  3 gelb        – Guru – 4.6:1
        - "#6d91d5"  #  4 blau        – Shani – 4.6:1
        - "#a288b3"  #  5 magenta     – Rahu – 4.6:1
        - "#00a2a3"  #  6 cyan        – Shukra – 4.6:1
        - "#a9a298"  #  7 weiss       – Chandra gedaempft – 5.7:1
        - "#979188"  #  8 hellschwarz – Ketu – 4.6:1
        - "#d07c3d"  #  9 hellrot     – Surya (Kupfer) – 4.6:1
        - "#83cd8e"  # 10 hellgruen   – Budha – 7.6:1
        - "#e3b648"  # 11 hellgelb    – Guru – 7.6:1
        - "#98bcff"  # 12 hellblau    – Shani – 7.6:1
        - "#cdb2df"  # 13 hellmagenta – Rahu – 7.6:1
        - "#3bcfd0"  # 14 hellcyan    – Shukra – 7.6:1
        - "#f2ede3"  # 15 hellweiss   – Chandra – 12.4:1

